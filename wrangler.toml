# Slima MCP Server - Cloudflare Worker Configuration
# https://developers.cloudflare.com/workers/wrangler/configuration/

name = "slima-mcp"
main = "dist/worker/index.js"
compatibility_date = "2025-01-01"

# Custom domain (requires slima.ai zone in Cloudflare)
routes = [
  { pattern = "mcp.slima.ai", custom_domain = true }
]

# Build configuration
[build]
command = "npm run build:worker"

# Environment variables
[vars]
SLIMA_API_URL = "https://api.slima.ai"
OAUTH_CLIENT_ID = "slima-mcp-worker"

# KV Namespace for OAuth sessions
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "24cf517e9e5e48e8903924e01cc0d1a2"

# Development environment — for `wrangler dev --env dev` against a local Rails.
# NOT a deploy target: SLIMA_API_URL points at localhost, and its KV id is a placeholder.
# `routes` is set explicitly to [] for the same reason [env.test] sets it explicitly:
# routes is an INHERITABLE key, so leaving it out would inherit the top-level
# mcp.slima.ai custom domain and a stray `wrangler deploy --env dev` would take
# prod's domain over. (2026-09-09: [env.preview] had exactly this shape and was
# documented in the README as the normal "Staging" command.)
[env.dev]
name = "slima-mcp-dev"
routes = []
workers_dev = true
vars = { SLIMA_API_URL = "http://localhost:3000", OAUTH_CLIENT_ID = "slima-mcp-worker-dev" }

[[env.dev.kv_namespaces]]
binding = "OAUTH_KV"
id = "your-dev-kv-namespace-id"  # Replace after `wrangler kv:namespace create OAUTH_KV --env dev`

# Test environment — delegates OAuth to the TEST Rails backend (test-api.slima.ai).
# Custom domain test-mcp.slima.ai (single-level → free Universal SSL, matches the test-api.slima.ai
# convention). IMPORTANT: `routes` MUST be defined here explicitly — `routes` is an inheritable key,
# so omitting it would inherit mcp.slima.ai and STEAL the prod custom domain on every deploy.
# Fully isolated from prod: own name / KV / route / SLIMA_API_URL.
[env.test]
name = "slima-mcp-test"
routes = [
  { pattern = "test-mcp.slima.ai", custom_domain = true }
]
vars = { SLIMA_API_URL = "https://test-api.slima.ai", OAUTH_CLIENT_ID = "slima-mcp-worker" }

[[env.test.kv_namespaces]]
binding = "OAUTH_KV"
id = "663e9957037648fea59274bb5dd941ce"

# Limits (free tier)
# - 100,000 requests/day
# - 10ms CPU time per request
# - 128MB memory

# Observability
[observability]
enabled = true
