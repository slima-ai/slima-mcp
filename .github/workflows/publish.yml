name: Publish to npm

on:
  workflow_dispatch:  # 允許手動觸發
  push:
    branches: [main]
    paths:
      - 'package.json'  # 只有 package.json 變更時才跑

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 需要 write 來建立 tag
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # 需要前一個 commit 來比較版本

      - name: Check if version changed
        id: version
        run: |
          NAME=$(node -p "require('./package.json').name")
          CURRENT=$(node -p "require('./package.json').version")
          echo "current=$CURRENT" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 手動觸發＝明確「現在發這一版」的意圖，不要拿 HEAD~1 來否決它。
            # 重跑通常發生在版本 commit 上面又疊了無關 commit 的時候
            # （2026-09-09：修 workflow 本身），那時 HEAD 與 HEAD~1 的版本
            # 相同 ⇒ 舊的比法會靜默跳過整個 job，看起來「成功」但什麼都沒發。
            # 唯一有意義的比較對象是 registry 上真正存在的版本。
            PUBLISHED=$(npm view "$NAME" version 2>/dev/null || echo "none")
            echo "previous=$PUBLISHED" >> $GITHUB_OUTPUT
            if [ "$CURRENT" != "$PUBLISHED" ]; then
              echo "changed=true" >> $GITHUB_OUTPUT
              echo "📦 Manual dispatch: npm has $PUBLISHED, publishing $CURRENT"
            else
              echo "changed=false" >> $GITHUB_OUTPUT
              echo "⏭️ Manual dispatch: $CURRENT is already on npm"
            fi
          else
            # push 觸發：只在這一顆 commit 真的動了版本號時才發。
            git checkout HEAD~1 -- package.json 2>/dev/null || true
            PREVIOUS=$(node -p "require('./package.json').version" 2>/dev/null || echo "0.0.0")
            git checkout HEAD -- package.json
            echo "previous=$PREVIOUS" >> $GITHUB_OUTPUT
            if [ "$CURRENT" != "$PREVIOUS" ]; then
              echo "changed=true" >> $GITHUB_OUTPUT
              echo "📦 Version changed: $PREVIOUS → $CURRENT"
            else
              echo "changed=false" >> $GITHUB_OUTPUT
              echo "⏭️ Version unchanged: $CURRENT"
            fi
          fi

      - name: Setup Node.js
        if: steps.version.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        if: steps.version.outputs.changed == 'true'
        run: npm ci

      - name: Run tests
        if: steps.version.outputs.changed == 'true'
        run: npm run test:run

      - name: Build
        if: steps.version.outputs.changed == 'true'
        run: npm run build

      - name: Publish to npm
        if: steps.version.outputs.changed == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create and push tag
        if: steps.version.outputs.changed == 'true'
        run: |
          VERSION=${{ steps.version.outputs.current }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
